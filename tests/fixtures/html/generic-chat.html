<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>老同学群 聊天记录</title>
  <!-- 通用聊天 HTML 风格：没有 QCE 专属字段，只有 class 线索 + 相对路径媒体 -->
</head>
<body>
  <div class="chat-list" data-chat-name="老同学群" data-chat-type="group">
    <div class="chat-item">
      <span class="nickname">小明(10001)</span>
      <span class="time">2024-01-02 03:04:05</span>
      <p class="bubble">大家好啊<br>好久不见</p>
      <img src="resources/hello.jpg" alt="hello.jpg" />
    </div>
    <div class="chat-item right own">
      <span class="nickname">我(10002)</span>
      <span class="time">2024-01-02 03:05:00</span>
      <p class="bubble">我发个语音</p>
      <audio src="resources/voice.amr"></audio>
      <video src="resources/clip.mp4"></video>
      <a href="resources/doc.pdf">doc.pdf</a>
    </div>
  </div>
</body>
</html>
